services:
  # ==========================================
  # 1. LAPISAN STORAGE: HADOOP HDFS
  # ==========================================
  namenode:
    image: apache/hadoop:3.4.3
    container_name: namenode
    hostname: namenode
    user: root
    command: >
      bash -c "
      mkdir -p /tmp/hadoop-data/namenode &&
      chown -R hadoop:hadoop /tmp/hadoop-data/namenode &&
      if [ ! -d /tmp/hadoop-data/namenode/current ]; then
        su -s /bin/bash hadoop -c '/opt/hadoop/bin/hdfs namenode -format -force -nonInteractive';
      fi &&
      su -s /bin/bash hadoop -c '/opt/hadoop/bin/hdfs namenode'
      "
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - namenode-data:/tmp/hadoop-data

  datanode1:
    image: apache/hadoop:3.4.3
    container_name: datanode1
    hostname: datanode1
    user: root
    command: >
      bash -c "
      mkdir -p /tmp/hadoop-data/datanode &&
      chown -R hadoop:hadoop /tmp/hadoop-data/datanode &&
      su -s /bin/bash hadoop -c '/opt/hadoop/bin/hdfs datanode'
      "
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - datanode1-data:/tmp/hadoop-data
    depends_on:
      - namenode

  datanode2:
    image: apache/hadoop:3.4.3
    container_name: datanode2
    hostname: datanode2
    user: root
    command: >
      bash -c "
      mkdir -p /tmp/hadoop-data/datanode &&
      chown -R hadoop:hadoop /tmp/hadoop-data/datanode &&
      su -s /bin/bash hadoop -c '/opt/hadoop/bin/hdfs datanode'
      "
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - datanode2-data:/tmp/hadoop-data
    depends_on:
      - namenode

  # ==========================================
  # 2. LAPISAN KOMPUTASI BATCH: HADOOP YARN
  # ==========================================
  resourcemanager:
    image: apache/hadoop:3.4.3
    container_name: resourcemanager
    hostname: resourcemanager
    user: root
    command: >
      bash -c "
      mkdir -p /tmp/hadoop-yarn &&
      chown -R hadoop:hadoop /tmp/hadoop-yarn &&
      su -s /bin/bash hadoop -c '/opt/hadoop/bin/yarn resourcemanager'
      "
    ports:
      - "8088:8088"
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - resourcemanager-data:/tmp/hadoop-yarn
    depends_on:
      - namenode

  nodemanager1:
    image: apache/hadoop:3.4.3
    container_name: nodemanager1
    hostname: nodemanager1
    user: root
    command: >
      bash -c "
      mkdir -p /tmp/hadoop-yarn &&
      chown -R hadoop:hadoop /tmp/hadoop-yarn &&
      su -s /bin/bash hadoop -c '/opt/hadoop/bin/yarn nodemanager'
      "
    ports:
      - "8042:8042"
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - nodemanager1-data:/tmp/hadoop-yarn
    depends_on:
      - resourcemanager
      - datanode1

  nodemanager2:
    image: apache/hadoop:3.4.3
    container_name: nodemanager2
    hostname: nodemanager2
    user: root
    command: >
      bash -c "
      mkdir -p /tmp/hadoop-yarn &&
      chown -R hadoop:hadoop /tmp/hadoop-yarn &&
      su -s /bin/bash hadoop -c '/opt/hadoop/bin/yarn nodemanager'
      "
    ports:
      - "8043:8042"
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - nodemanager2-data:/tmp/hadoop-yarn
    depends_on:
      - resourcemanager
      - datanode2

  # ==========================================
  # 3. LAPISAN KOMPUTASI IN-MEMORY: APACHE SPARK
  # ==========================================
  spark-master:
    image: apache/spark:3.5.6
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    depends_on:
      - namenode

  spark-worker-1:
    image: apache/spark:3.5.6
    container_name: spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    ports:
      - "8081:8081"
    depends_on:
      - spark-master

  spark-worker-2:
    image: apache/spark:3.5.6
    container_name: spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    ports:
      - "8082:8081"
    depends_on:
      - spark-master

volumes:
  namenode-data:
  datanode1-data:
  datanode2-data:
  resourcemanager-data:
  nodemanager1-data:
  nodemanager2-data:
